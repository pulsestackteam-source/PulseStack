name: Generate 5k Auto-Select Config

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Generate config.json via Python
        run: |
          python3 - << 'PYEOF'
          import json
          import asyncio
          import aiohttp
          from urllib.parse import urlparse, parse_qs, unquote

          SOURCE_URL = "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/refs/heads/main/separated-protocols-chunks/vless/EbraSha-Protocol-Chunks-vless-001.txt"
          OUTPUT_FILE = "config.json"
          MAX_SERVERS = 1000

          async def fetch_sources():
              async with aiohttp.ClientSession() as session:
                  try:
                      async with session.get(SOURCE_URL, timeout=aiohttp.ClientTimeout(total=20)) as resp:
                          if resp.status == 200:
                              return await resp.text()
                  except Exception as e:
                      print(f"Fetch Error: {e}")
              return ""

          def parse_vless_link(link):
              try:
                  if not link.startswith("vless://"):
                      return None
                  
                  # 1. Убираем префикс
                  content = link[8:]
                  
                  # 2. Отделяем имя (fragment) после #
                  server_name = ""
                  if '#' in content:
                      core, fragment = content.split('#', 1)
                      server_name = unquote(fragment)
                  else:
                      core = content
                      server_name = f"Server-{hash(core) % 10000}"

                  # 3. Отделяем пользователя от хоста по первому @
                  if '@' not in core:
                      return None
                  
                  user_part, host_part = core.split('@', 1)
                  uuid = user_part.split(':')[0] # UUID всегда до двоеточия или конца user_part
                  
                  # 4. Чистим host_part от путей (если порт выглядит как 8443/)
                  # Иногда бывает vless://uuid@host:port/path?query
                  path_and_query = ""
                  if '/' in host_part:
                      host_addr, path_and_query = host_part.split('/', 1)
                  else:
                      host_addr = host_part

                  # 5. Парсим адрес и порт
                  port = 443
                  address = host_addr
                  
                  # Обработка IPv6 [::1]:port или domain:port
                  if host_addr.startswith('['):
                      bracket_end = host_addr.find(']')
                      if bracket_end != -1:
                          address = host_addr[1:bracket_end]
                          remaining = host_addr[bracket_end+1:]
                          if remaining.startswith(':'):
                              try: port = int(remaining[1:])
                              except: pass
                  else:
                      if ':' in host_addr:
                          parts = host_addr.rsplit(':', 1)
                          address = parts[0]
                          try: port = int(parts[1])
                          except: pass # Если порт кривой, оставим дефолт 443

                  # 6. Парсим параметры из path_and_query (если они есть после /)
                  query_params = {}
                  if '?' in path_and_query:
                      _, query_string = path_and_query.split('?', 1)
                      query_params = parse_qs(query_string)
                  
                  # Извлекаем настройки
                  flow = query_params.get('flow', [''])[0]
                  sni = query_params.get('sni', [address])[0]
                  pbk = query_params.get('pbk', [''])[0]
                  sid = query_params.get('sid', [''])[0]
                  fp = query_params.get('fp', ['chrome'])[0]
                  net_type = query_params.get('type', ['tcp'])[0]
                  service_name = query_params.get('serviceName', [''])[0]
                  path = query_params.get('path', ['/'])[0]

                  return {
                      "address": address,
                      "port": port,
                      "id": uuid,
                      "flow": flow,
                      "sni": sni,
                      "pbk": pbk,
                      "sid": sid,
                      "fp": fp,
                      "net": net_type,
                      "serviceName": service_name,
                      "path": path,
                      "name": server_name
                  }
              except Exception as e:
                  # print(f"Skip line: {e}")
                  return None

          def create_outbound(tag, data):
              stream_set = {"network": data["net"]}
              
              if data["pbk"]:
                  stream_set["security"] = "reality"
                  stream_set["realitySettings"] = {
                      "serverName": data["sni"],
                      "publicKey": data["pbk"],
                      "fingerprint": data["fp"],
                      "shortId": data["sid"]
                  }
              elif data["sni"] and data["sni"] != data["address"]:
                  stream_set["security"] = "tls"
                  stream_set["tlsSettings"] = {
                      "serverName": data["sni"],
                      "fingerprint": data["fp"]
                  }
              else:
                  stream_set["security"] = "none"

              if data["net"] == "grpc":
                  stream_set["grpcSettings"] = {"serviceName": data["serviceName"]}
              elif data["net"] == "ws":
                  stream_set["wsSettings"] = {"path": data["path"], "headers": {"Host": data["sni"]}}

              return {
                  "protocol": "vless",
                  "settings": {
                      "vnext": [{
                          "address": data["address"],
                          "port": data["port"],
                          "users": [{"id": data["id"], "encryption": "none", "flow": data["flow"]}]
                      }]
                  },
                  "streamSettings": stream_set,
                  "tag": tag
              }

          async def main():
              print("Fetching 26.txt...")
              raw_data = await fetch_sources()
              
              outbounds = []
              count = 0
              
              lines = raw_data.strip().split('\n')
              print(f"Total lines: {len(lines)}")

              for line in lines:
                  if count >= MAX_SERVERS: break
                  line = line.strip()
                  if not line.startswith("vless://"): continue
                  
                  data = parse_vless_link(line)
                  if data:
                      tag = f"proxy-{count + 1}"
                      outbounds.append(create_outbound(tag, data))
                      count += 1

              print(f"Parsed: {count} servers.")

              # Финальный конфиг
              final_config = {
                  "log": {"access": "", "error": "", "loglevel": "warning"},
                  "dns": {
                      "servers": ["https://1.1.1.1/dns-query"],
                      "queryStrategy": "UseIPv4"
                  },
                  "routing": {
                      "domainStrategy": "AsIs",
                      "domainMatcher": "hybrid",
                      "balancers": [{
                          "tag": "balancer",
                          "selector": ["proxy-"],
                          "strategy": {"type": "leastPing"},
                          "fallbackTag": "proxy-1"
                      }],
                      "rules": [
                          {"port": "53", "type": "field", "network": "tcp,udp", "outboundTag": "dns-out"},
                          {"type": "field", "ip": ["geoip:private"], "outboundTag": "direct"},
                          {"type": "field", "network": "tcp,udp", "balancerTag": "balancer"}
                      ]
                  },
                  "inbounds": [
                      {"tag": "socks", "port": 10808, "listen": "127.0.0.1", "protocol": "socks", "settings": {"udp": True, "auth": "noauth"}}
                  ],
                  "outbounds": outbounds + [
                      {"tag": "direct", "protocol": "freedom", "settings": {}},
                      {"tag": "dns-out", "protocol": "dns", "settings": {}}
                  ],
                  "burstObservatory": {
                      "pingConfig": {
                          "timeout": "3s",
                          "interval": "30s",
                          "sampling": 2,
                          "destination": "http://www.gstatic.com/generate_204"
                      },
                      "subjectSelector": ["proxy-"]
                  },
                  "remarks": "🇺 Авто выбор"
              }

              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  json.dump(final_config, f, indent=2, ensure_ascii=False)
              
              print("Done. config.json saved.")

          asyncio.run(main())
          PYEOF

      - name: Commit and Push changes
        run: |
          git config --global user.name "Dwen-Bot"
          git config --global user.email "dwen@vpn.local"
          git add config.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: 5k servers pool 🇪🇺 [$(date)]" && git push)
